---
KNMI_MSG:
  crs: EPSG:4326
  format: NetCDF4
  base_url: https://api.dataplatform.knmi.nl/wms/adaguc-server?dataset=msg_cpp_products&service=wcs&request=getcoverage&
  variables:
  - surface_downwelling_shortwave_flux_in_air
  - surface_downwelling_shortwave_flux_in_air_assuming_clear_sky
  nc_variable_names:
    sds: sds
    sds_cs: sds_cs
  # Required here or via the INPUT_FILENAME_FORMAT environment variable
  # (the environment variable takes priority): Filename format for input data files
  # input_filename_format: "{dataset_name}_{timestamp}_{domain_satellite_name}.nc"
  # Format for PDS data:
  input_filename_format: "NetCDF4_sds_{pds_timestamp}.nc"
  # Available template variables:
  #   {dataset_name}: Dataset name (e.g., KNMI)
  #   {domain_satellite_name}: Satellite domain identifier (e.g., NW_EUROPE_SATELLITE)
  #   {timestamp}: Compact format YYYYMMDDHHMM
  #   {pds_timestamp}: PDS format YYYY-MM-DDTHH_MM_SSZ
  #   {iso8601_compact_timestamp}: ISO 8601 format timestamp (e.g., YYYY-MM-DDTHHMMZ)
  #   {year}: Four-digit year (e.g., 2026)
  #   {month}: Two-digit month (e.g., 03)
  #   {day}: Two-digit day of month (e.g., 09)
  #   {hour}: Two-digit hour (e.g., 12)
  #   {second}: Two-digit second (e.g., 00)
  # Path separators are supported, e.g.: "{year}/{month}/{day}/{dataset_name}_{timestamp}.nc"
  #
  # Optional: output_filename_format (or the OUTPUT_FILENAME_FORMAT environment
  # variable, which takes priority)
  # Filename format for output forecast files.
  # Defaults to "SolarNowcast_{iso8601_compact_timestamp}.nc" if omitted.
  # Supports the same template variables as input_filename_format, except
  # {domain_satellite_name}, which is not available for output files.
  # output_filename_format: "SolarNowcast_{iso8601_compact_timestamp}.nc"
  satellite: Meteosat Second Generation (MSG)

KNMI_MTG:
  crs: EPSG:4326
  format: NetCDF4
  base_url: https://api.dataplatform.knmi.nl/wms/adaguc-server?dataset=mtg_cpp_products&service=wcs&request=getcoverage&
  variables:
  - surface_downwelling_shortwave_flux_in_air
  - surface_downwelling_shortwave_flux_in_air_assuming_clear_sky
  nc_variable_names:
    sds: sds
    sds_cs: sds_cs
  input_filename_format: "NetCDF4_sds_{pds_timestamp}.nc"
  output_filename_format: "SolarNowcast_MTG-CPP_{iso8601_compact_timestamp}.nc"
  input_data_frequency_minutes: 10
  satellite: Meteosat Third Generation (MTG)

DWD:
  base_url: https://opendata.dwd.de/weather/satellite/radiation/sis/
  variables:
  - SIS
  - SISc
  nc_variable_names:
    sds: SIS
    sds_cs: SISc
  # Required here or via the INPUT_FILENAME_FORMAT environment variable: Filename format for input data files
  # Supports subdirectories via path separators, e.g.: "{year}/{month}/{day}/{dataset_name}_{timestamp}_{domain_satellite_name}.nc"
  input_filename_format: "{dataset_name}_{timestamp}_{domain_satellite_name}.nc"
  satellite: Meteosat Second Generation (MSG)

specMAGIC_MTG:
  nc_variable_names:
    sds: GHI
    sds_cs: CSR
  input_filename_format: "GHI/GHI{year}{month}{day}{hour}{minute}.nc"
  input_data_frequency_minutes: 10
  clearsky:
    method: file
    path: "CSR/CSR{year}{month}{day}{hour}{minute}.nc"
  satellite: Meteosat Third Generation (MTG)

specMAGIC_MTG_pvlib:
  nc_variable_names:
    sds: GHI
    sds_cs: GHI_clearsky
  input_filename_format: "GHI/GHI{year}{month}{day}{hour}{minute}.nc"
  input_data_frequency_minutes: 10
  clearsky:
    method: pvlib
  satellite: Meteosat Third Generation (MTG)
